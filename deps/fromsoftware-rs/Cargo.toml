# er-apex: fromsoftware-rs 5702315 (vswarte/fromsoftware-rs) with only the crates it uses, and the
# 2.7.1.x address tables of 59fbd3b kept beside 2.7.2.x's (crates/eldenring/src/rva.rs)
[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/shared/macros",
    "crates/shared/stl",
    "crates/eldenring",
]

[workspace.package]
version = "0.14.0"
edition = "2024"
repository = "https://github.com/vswarte/eldenring-rs"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fromsoftware-shared = { path = "crates/shared", version = "0.14.0", package = "fromsoftware-shared" }
fromsoftware-shared-macros = { path = "crates/shared/macros", version = "0.14.0", package = "fromsoftware-shared-macros" }
fromsoftware-shared-stl = { path = "crates/shared/stl", version = "0.14.0", package = "fromsoftware-shared-stl" }
eldenring = { path = "crates/eldenring", version = "0.14.0", package = "eldenring" }
bitflags = "2.13.1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2.5"
tracing-panic = "0.1"
glam = ">= 0.30"
byteorder = "1"
pelite = "0.10"
vtable-rs = "0.1.5"
bitfield = "0.19.5"
encoding_rs = "0.8.35"
libhotpatch = "1.2.0"
toml = "1.1.4"
num_enum = "0.7"

[workspace.dependencies.serde]
version = "1"
features = ["derive"]

[workspace.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_Security",
]

[workspace.dependencies.hudhook]
git = "https://github.com/veeenu/hudhook"
features = ["imgui-tables-api"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"

[profile.ci]
inherits = "dev"

[profile.ci.package."*"]
