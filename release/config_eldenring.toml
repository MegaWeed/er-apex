# ModEngine2 (Melty starts the game through it, offline with Easy Anti-Cheat off): the mod's DLL and
# its armour models (package\, made on the first start by setup.ps1). Paths are from this file.
[modengine]
debug = false
external_dlls = ["er_apex.dll"]

[extension.mod_loader]
enabled = true
loose_params = false
mods = [
    { enabled = true, name = "er-apex", path = "package" },
]

[extension.scylla_hide]
enabled = false
