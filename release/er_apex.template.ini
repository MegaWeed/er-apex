# er-apex settings (key = value; # starts a comment). release/setup.ps1 writes er_apex.ini from this
# file, then the asset folders it made, then er_apex.user.ini when you have one: put your own
# settings there (they stay when the setup runs again).
#
#   fov = 90                 first-person field of view (70-110; Apex's 4:3 horizontal degrees)
#   fps_limit = 120          the game's frame cap (0: the game's 60)
#   player_name = name       the HUD's player name (default: your character's)
#   keyboard_only = 0        let the game see your controller (its button prompts become a pad's)
#   gun_damage_mult = 1      Apex's own gun damage (the default triples it against Elden Ring's HP)
#   pad_cooldown = 25        the jump pad's Apex cooldown (default none)

debug = 0
dev = 0
kcc = 1
fuse_model = 1
lethal_guard = 1
gun = 1
first_person = 1
camera_shoulder = 1
hud_hide = 1
virtual_pad = 0
keyboard_only = 1
fov = 90
gun_damage_mult = 3
pad_cooldown = 0
