# ER-Apex dev settings (tools/dev/game.ps1 install writes this to scratch\mod\er_apex.ini)
#
# Other keys the mod reads (pass them per run: game.ps1 install -Set "a = 1;b = 2"):
#   quickboot = 1            start straight at Godrick's fog gate (spike S7)
#   qb_place = grace         stop at the Secluded Cell grace instead (mob tests until D-025)
#   qb_place = first_step    go to Limgrave's The First Step grace instead (normal tests, D-025;
#                            game.ps1 spawn: three soldiers by the grace, test arena T013)
#   fuse_model = 1           Fuse's armour (model 999) on the Tarnished
#   lethal_guard = 1         Fuse's own HP and the no-death guard (S8); fuse_damage_scale
#   gun = 1                  R-301 on the attack buttons, HUD, audio
#   audio_dir = <dir>        exported Apex sounds (tools/fuseaudio), else <mod>\audio; volume
#   camera_shoulder = 1      over-the-shoulder camera (camera.rs)
#   first_person = 1         first person (camera.rs, firstperson.rs); Apex view model when the mod
#                            folder has fuse_pov.anim (tools/apexpov) and package model 998 (T011);
#                            dev commands fp (v1 tuning), fpdbg (yaw log), fpgroup (render-group probe)
#   hud_hide = 1             hide Elden Ring's own HUD during play (fe.rs)
#   hud_dir = <dir>          Apex HUD pack (T009: apex-data\hud), else <mod>\hud; hud_language
#   hud_debug = 1            projection calibration overlay
#   npc_names = <file>       Elden Ring's NpcName text for the kill feed (ertool fmg NpcName.fmg
#                            --json, e.g. er-data\json\NpcName_zhocn.json), else <mod>\npc_names.json
#   enemy_apex_hp, boss_apex_hp_mult, bullet_mode, mvp_reset_boss, pose_hook, dev_quit_after
#
# Typical run with everything on:
#   quickboot = 1;qb_place = grace;fuse_model = 1;lethal_guard = 1;gun = 1;
#   audio_dir = apex-data\audio;camera_shoulder = 1;hud_hide = 1;hud_dir = apex-data\hud
debug = 1
dev = 1
virtual_pad = 1
